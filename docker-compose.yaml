services:
  app:
    build:
      context: .
    container_name: distributedsystems
    ports:
      - '3000:3000'
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3000}
      MONGODB_URL: ${MONGODB_URL:-mongodb://mongodb:27017/mongo-distributedsystems}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      CACHE_TTL: ${CACHE_TTL:-60}
      TRAFFIC_DISTRIBUTION_TYPES: ${TRAFFIC_DISTRIBUTION_TYPES:-poisson,uniforme}
    depends_on:
      - mongodb
      - redis
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run start:dev

  # Servicio MongoDB
  mongodb:
    image: mongo:5
    container_name: mongo-distributedsystems
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    restart: always

  # Servicio Redis
  redis:
    image: redis:latest
    container_name: redis-distributedsystems
    ports:
      - '6379:6379'
    restart: always
    ### Politicas de remocion y tamaño de cache, descomentar la politica a utilizar y comentar TODAS las demas (Cambian tamaño de cache a gusto):
    ## Politica de remocion LRU
    command: redis-server --save "" --appendonly no --maxmemory 250kb --maxmemory-policy allkeys-lru
    ## Politica de remocion LFU
    # command: redis-server --save "" --appendonly no --maxmemory 150kb --maxmemory-policy allkeys-lfu

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    hostname: namenode
    ports:
      - '9870:9870'
      - '8020:8020'
    env_file:
      - ./hadoop-config/hadoop.env
    environment:
      - CLUSTER_NAME=test
    volumes:
      - hadoop_namenode:/hadoop/dfs/name

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    hostname: datanode
    env_file:
      - ./hadoop-config/hadoop.env
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    environment:
      SERVICE_PRECONDITION: 'namenode:9870'
    depends_on:
      - namenode

  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    hostname: resourcemanager
    ports:
      - '8088:8088'
    env_file:
      - ./hadoop-config/hadoop.env
    environment:
      SERVICE_PRECONDITION: 'namenode:9870'
    depends_on:
      - namenode

  nodemanager:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    hostname: nodemanager
    env_file:
      - ./hadoop-config/hadoop.env
    environment:
      SERVICE_PRECONDITION: 'namenode:9870,resourcemanager:8088'
    depends_on:
      - namenode
      - resourcemanager

  pig:
    build:
      context: ./hadoop-config/pig-dockerfile
    hostname: pig
    environment:
      SERVICE_PRECONDITION: 'namenode:9870,resourcemanager:8088'
      # Estas variables de entorno de Hadoop son cruciales para que Pig sepa dónde está el clúster
      # y ya deberían estar bien configuradas si usas el env_file en los otros servicios hadoop.
      # Asegúrate que el NameNode es accesible por su hostname 'namenode'
      CORE_CONF_fs_defaultFS: hdfs://namenode:8020
      YARN_CONF_yarn_resourcemanager_hostname: resourcemanager
    depends_on:
      - namenode
      - datanode
      - resourcemanager
      - nodemanager
    volumes:
      - ./pig-scripts:/pig-scripts # Monta tu directorio de scripts de Pig
      - ./data:/data # Monta el volumen de datos compartido
    # Puedes dejar el entrypoint por defecto o poner un script si quieres que Pig haga algo al iniciar
    # entrypoint: ["/bin/bash"] # Si quieres entrar interactivamente por defecto
    # O, si quieres que Pig ejecute un script automáticamente al iniciar el servicio:
    # entrypoint: ["pig", "-f", "/pig-scripts/your_startup_script.pig"]
    # Para tu caso de solo tenerlo listo para ejecutar, /bin/bash es conveniente.

volumes:
  mongo_data:
  hadoop_namenode:
  hadoop_datanode:
