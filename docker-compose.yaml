services:
  mongodb:
    image: mongo:5
    container_name: mongo-distributedsystems 
    ports:
      - "27017:27017"
    volumes:
      - mongo:/data/db 
    restart: always 
    
  redis:
    image: redis:latest 
    container_name: redis-distributedsystems 
    ports:
      - "6379:6379"
    restart: always 

volumes:
  mongo: 
